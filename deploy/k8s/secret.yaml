# Credentials only -- everything else lives in configmap.yaml.
#
# Both keys are optional and this Secret is deliberately empty by default:
# file and stdout export modes need no API key, and SASL is off unless you
# enable it in configmap.yaml. The Deployment references this Secret with
# envFrom, so it must exist even when it holds nothing; an empty Opaque
# Secret is valid.
#
# Do not commit real credentials. Create them out of band instead:
#
#   kubectl create secret generic streamsight-agent \
#     --from-literal=API_KEY=... \
#     --from-literal=KAFKA_SASL_PASSWORD=...
#
# or replace this file with a SealedSecret / ExternalSecret keeping the same
# name and keys.
apiVersion: v1
kind: Secret
metadata:
  name: streamsight-agent
  labels:
    app: streamsight-agent
type: Opaque
stringData: {}
  # Required only when EXPORT_MODE=http.
  # API_KEY: "your-api-key"
  # Required only when KAFKA_SASL_MECHANISM is set in configmap.yaml.
  # KAFKA_SASL_PASSWORD: "your-sasl-password"
