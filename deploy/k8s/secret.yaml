apiVersion: v1
kind: Secret
metadata:
  name: streamsight-agent
  labels:
    app: streamsight-agent
type: Opaque
stringData:
  # Required
  KAFKA_BROKERS: "broker1:9092,broker2:9092"
  API_KEY: "your-api-key"
  # Optional - uncomment if using SASL
  # KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  # KAFKA_SASL_USERNAME: "user"
  # KAFKA_SASL_PASSWORD: "pass"
