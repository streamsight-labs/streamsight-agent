# Non-secret configuration. Every key maps onto an environment variable read
# by internal/config/config.go, which validates the whole surface at startup:
# a bad value fails the pod immediately instead of on the first tick.
#
# As written this deploys in local file mode -- no endpoint, no API key, no
# egress. See the EXPORT block for switching to http.
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamsight-agent
  labels:
    app: streamsight-agent
data:
  # -- Kafka (required) ---------------------------------------------------
  KAFKA_BROKERS: "broker1:9092,broker2:9092"
  KAFKA_TLS_ENABLED: "false"
  # Uncomment together with KAFKA_SASL_PASSWORD in secret.yaml.
  # KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"   # PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512
  # KAFKA_SASL_USERNAME: "streamsight-agent"

  # -- Export -------------------------------------------------------------
  # file   write JSONL to the emptyDir mounted at /var/lib/streamsight
  # http   POST to EXPORT_ENDPOINT (also needs API_KEY in secret.yaml)
  # stdout write JSONL to stdout; the agent's own logs stay on stderr
  EXPORT_MODE: "file"

  # File mode. EXPORT_FILE must point inside the mounted volume: the
  # container root filesystem is read-only.
  EXPORT_FILE: "/var/lib/streamsight/metrics.jsonl"
  EXPORT_FILE_MAX_MB: "100" # rotate at this size; negative disables rotation
  EXPORT_FILE_MAX_BACKUPS: "3" # rotated files kept; 0 keeps none
  # fsync after every batch. Off by default: a flush already survives the
  # process dying, and the emptyDir below dies with the pod anyway.
  # EXPORT_FILE_FSYNC: "false"

  # HTTP mode. Uncomment these and set EXPORT_MODE=http.
  # EXPORT_ENDPOINT: "https://ingest.example.com/v1/batches"
  # EXPORT_QUEUE_SIZE: "20"     # queue of encoded bodies; overflow evicts the OLDEST
  # EXPORT_MAX_RETRIES: "3"     # retries per batch on 408/429/5xx
  # EXPORT_BASE_DELAY: "1s"     # full-jitter backoff base
  # EXPORT_TIMEOUT: "10s"       # per-request deadline
  # EXPORT_GZIP: "true"

  # -- Collection ---------------------------------------------------------
  # Left unset on purpose: the agent's own default (currently 5s) applies, and
  # a value pinned here would shadow it silently the next time it moves. Set it
  # only to override. Every *_EVERY knob is a CYCLE COUNT, so changing this
  # changes their wall-clock meaning too.
  # COLLECTION_INTERVAL: "5s"
  # Per-cycle deadline. Omitted, the agent derives 80% of the interval.
  # COLLECTION_TIMEOUT: "4s"
  INCLUDE_INTERNAL_TOPICS: "false"
  # Filters. Empty or absent means match everything; exclude wins over
  # include. Compiled at startup, so a bad pattern fails the pod.
  # TOPIC_INCLUDE_REGEX: ""
  # TOPIC_EXCLUDE_REGEX: "^_"
  # GROUP_INCLUDE_REGEX: ""
  # GROUP_EXCLUDE_REGEX: ""
  # Broker-side group-state filter: Unknown | PreparingRebalance |
  # CompletingRebalance | Stable | Dead | Empty, comma separated. The only
  # cardinality control applied before the response is built, so filtered
  # groups never cross the wire -- but it requires Kafka 2.6+, and the agent
  # probes every broker at startup and REFUSES TO START if any is older,
  # because an older broker ignores the filter and returns every group. It
  # also shortens offsets[], and a group leaving the set looks deleted.
  # GROUP_STATES: "Stable,Empty"

  # -- Optional collectors ------------------------------------------------
  # The offset and log-dir switches need no ACL beyond the three DESCRIBE
  # grants; COLLECT_CONFIGS below is the one exception, and says so.
  #
  # last_stable_offset: leave it on. end_offset is the high watermark, so
  # without the LSO every read_committed consumer on a transactional topic
  # reports permanent false lag, with nothing anywhere reporting a failure.
  COLLECT_LAST_STABLE_OFFSET: "true"
  # log_dirs: per-broker, per-directory replica bytes, per-replica lag and
  # offline-disk detection. On: it is the only source of disk bytes, so
  # days-to-full, per-topic storage and byte-rate-per-record all rest on it.
  # The response is O(replicas) = partitions x replication factor and is the
  # largest section emitted, which is what LOG_DIRS_EVERY is for. On a wide
  # cluster set MAX_PARTITIONS_PER_TOPIC below -- unlike the offset listings,
  # the log-dir request names partitions explicitly, so that cap shrinks the
  # request itself and not just the payload.
  COLLECT_LOG_DIRS: "true"
  # Cadence for the log-dirs phase. Must be >= 1 (1 = every cycle). Unset uses
  # the agent default, currently 24 = every two minutes at the 5s interval.
  # LOG_DIRS_EVERY: "24"
  # topic_configs / broker_configs. On by default, and the only collector
  # needing an ACL outside the three DESCRIBE grants: DESCRIBE_CONFIGS on TOPIC
  # and on CLUSTER. Missing either is not fatal -- that section reports
  # `unauthorized` and the rest of the batch is unaffected. Leave it on:
  # without cleanup.policy nothing downstream can tell a topic is compacted,
  # and on a compacted topic consumer lag is overstated by an unknowable
  # amount with nothing flagging it as unreliable.
  # COLLECT_CONFIGS: "true"
  # Unset uses the agent default, currently 360 = every thirty minutes at the
  # 5s interval, the slowest cadence in the agent.
  # CONFIGS_EVERY: "360"

  # -- Cardinality caps ---------------------------------------------------
  # Hard ceilings on one batch. Every ENTITY cap defaults to 0 = unlimited,
  # deliberately: a non-zero default would silently shorten the customer's own
  # inventory on first deploy. Prefer the include regexes above for
  # intentional selection. None of these adds a request or an ACL, and each
  # one that is set logs a startup warning.
  #
  # MAX_ERRORS backstops errors[], which is deduplicated unconditionally, so
  # it essentially never fires. 0 = unlimited (and warns).
  # MAX_ERRORS: "1000"
  # MAX_ERROR_SAMPLES: "1"        # verbatim samples per distinct failure mode; >= 1
  # MAX_TOPICS: "0"               # also shrinks the offset and log-dir requests
  # MAX_PARTITIONS_PER_TOPIC: "0" # payload cap; also shrinks the log-dir request
  # MAX_GROUPS: "0"               # ALSO truncates the offsets section, not just groups
  # MAX_MEMBERS_PER_GROUP: "0"
  # MAX_OFFSETS_PER_GROUP: "0"

  # -- Agent --------------------------------------------------------------
  LOG_LEVEL: "info" # debug | info | warn | error
