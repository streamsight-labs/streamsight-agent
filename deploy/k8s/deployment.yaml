apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamsight-agent
  labels:
    app: streamsight-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamsight-agent
  template:
    metadata:
      labels:
        app: streamsight-agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/streamsight/agent:latest
          envFrom:
            - secretRef:
                name: streamsight-agent
          env:
            - name: COLLECTION_INTERVAL
              value: "30s"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      securityContext:
        fsGroup: 1000
