name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Same toolchain as CI and the Dockerfile builder.
          go-version-file: go.mod
          cache: true

      # The tag verbatim, which is also what the Makefile's `git describe`
      # produces, stamped into main.version with the same ldflag. It travels
      # on every batch as agent_version.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "building ${VERSION} for ${GOOS}/${GOARCH}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o streamsight-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamsight-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: streamsight-agent-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum streamsight-agent-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
