# The gate that actually runs on every change. The Docker and Release
# workflows only fire on v* tags, so before this existed the test suite had
# never run in CI.
name: CI

on:
  push:
    branches:
      - '**'
    # Tags too, and this is not redundant with the branch glob: a `v*` tag push
    # is its own event, and without this line the Docker and Release workflows
    # would build and publish from a ref at which the suite had never run. They
    # still run in parallel with this workflow rather than after it -- fixing
    # that properly needs a workflow_run gate -- but a red CI on the release
    # commit is at least visible before the artifact is announced.
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

# A push to a branch that already has a PR would otherwise run this twice.
# Keying on the branch name (not the ref) puts both events in one group, so
# the newer run cancels the older.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Single source of truth: the toolchain matches the module's
          # declared version and the Dockerfile's builder image.
          go-version-file: go.mod
          cache: true

      # Fails the build if anything is unformatted. gofmt exits 0 either way,
      # so the check is on its output, not its status.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files; run 'make fmt'"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -race is the point: the collector fans out five goroutines per cycle
      # and the exporters share counters across a worker.
      #
      # -covermode=atomic because -race demands it; the profile is only here to
      # be reported, never to gate.
      - name: go test -race
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...

      # Coverage as information, deliberately not as a threshold. A number that
      # blocks a merge gets satisfied by tests written to move the number, and
      # the parts of this agent that are actually hard to get right -- what a
      # broker returns under a partial failure -- are the parts a unit test
      # cannot reach at all. Printed where a reviewer sees it, and that is all.
      - name: Coverage
        run: |
          {
            echo "### Coverage"
            echo ''
            echo '```'
            go tool cover -func=cover.out | tail -n 1
            echo '```'
            echo ''
            echo '<details><summary>Per function</summary>'
            echo ''
            echo '```'
            go tool cover -func=cover.out
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # Non-blocking on purpose. govulncheck reports against Go's advisory
      # database, which moves on Go's schedule and not on this repo's: a stdlib
      # advisory published overnight would otherwise redden a PR that changed a
      # comment. The finding still has to be seen, so it goes to the run
      # summary rather than into a log nobody opens.
      #
      # @latest rather than a pinned scanner: the whole value is freshness, and
      # pinning govulncheck pins its idea of which vulnerabilities exist. It is
      # `go run`, so nothing enters go.mod.
      - name: govulncheck (informational)
        continue-on-error: true
        run: |
          {
            echo "### govulncheck"
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # The linter version is pinned: golangci-lint adds checks in minor
      # releases, so floating it means an unrelated PR turns red because a new
      # check landed that morning. Bumping it is a deliberate commit, and
      # dependabot keeps the action itself current.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint charts/streamsight-agent

      # Both credential states must render. The API key is optional because
      # file and stdout export modes need none, and a chart that only renders
      # with a key would make local mode uninstallable.
      - name: helm template (defaults, empty apiKey)
        run: helm template streamsight charts/streamsight-agent > /tmp/render-default.yaml

      - name: helm template (http mode, populated apiKey)
        run: |
          helm template streamsight charts/streamsight-agent \
            --set export.mode=http \
            --set export.http.endpoint=https://ingest.example.com/v1/batches \
            --set export.http.apiKey=ci-test-key \
            --set kafka.sasl.enabled=true \
            --set kafka.sasl.username=agent \
            --set kafka.sasl.password=ci-test-password \
            --set kafka.tls.enabled=true \
            > /tmp/render-http.yaml

      - name: helm template (stdout mode)
        run: |
          helm template streamsight charts/streamsight-agent \
            --set export.mode=stdout > /tmp/render-stdout.yaml

      # The chart refuses to render configurations the agent would reject at
      # startup. If these ever succeed, the guard rails have rotted.
      - name: helm template (invalid values must fail)
        run: |
          expect_fail() {
            desc="$1"; shift
            if helm template streamsight charts/streamsight-agent "$@" >/dev/null 2>&1; then
              echo "::error::expected chart to reject: $desc"
              exit 1
            fi
            echo "ok, rejected: $desc"
          }
          expect_fail "http without an api key"  --set export.mode=http --set export.http.endpoint=https://x
          expect_fail "http without an endpoint" --set export.mode=http --set export.http.apiKey=k
          expect_fail "unknown export mode"      --set export.mode=kafka
          expect_fail "EXPORT_FILE outside the writable mount" --set export.file.path=/data/metrics.jsonl
          expect_fail "empty brokers"            --set kafka.brokers=
          expect_fail "unknown log level"        --set agent.logLevel=verbose

      - name: Install kubeconform
        run: |
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      # Schema validation against the real Kubernetes API schemas -- catches a
      # misspelled or misplaced field that `helm template` is perfectly happy
      # to emit. -strict also rejects unknown fields.
      #
      # kubeconform rather than `kubectl apply --dry-run=client`: the kubectl
      # form downloads the OpenAPI schema from a live API server and fails
      # without a cluster, so it is not the cheap option it looks like.
      - name: kubeconform (rendered chart)
        run: |
          kubeconform -strict -summary -kubernetes-version 1.29.0 \
            /tmp/render-default.yaml /tmp/render-http.yaml /tmp/render-stdout.yaml

      - name: kubeconform (plain manifests)
        run: kubeconform -strict -summary -kubernetes-version 1.29.0 deploy/k8s/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Build only, never push: this is the check that a Dockerfile change
      # compiles before it reaches a release tag. amd64 alone keeps it fast;
      # the multi-arch build happens on release.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: streamsight-agent:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The version ldflag has to survive into the binary, or agent_version is
      # empty on every batch the released image ships.
      #
      # `-version` is a real exit-0 path, so this asserts the exact string on
      # stdout. It used to start the agent against a broker that does not
      # exist, let the dial fail, and grep stderr for `version=` -- which
      # asserted the ldflag only incidentally and would have kept passing if
      # the value were wrong but non-empty.
      - name: Verify version ldflag and non-root user
        run: |
          test "$(docker run --rm --entrypoint id streamsight-agent:ci -u)" = "1000"
          out="$(docker run --rm streamsight-agent:ci -version)"
          echo "$out"
          echo "$out" | grep -qx "kafka-metrics-agent ci-${{ github.sha }}" \
            || { echo "::error::VERSION build-arg did not reach main.version"; exit 1; }
