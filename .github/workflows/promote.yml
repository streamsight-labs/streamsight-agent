# Moves the MUTABLE image tags (:latest and the floating :MAJOR.MINOR) onto an
# already-published release image.
#
# This is deliberately a separate, manually-triggered workflow rather than a job
# in docker.yml. The obvious implementation -- a promote job gated on
# `environment: release` with required reviewers -- does not work here: GitHub
# only offers environment protection rules on public repositories or paid plans,
# and silently serves an UNPROTECTED environment otherwise. That version would
# have looked correct and gated nothing. Requiring a human to start this run is a
# real gate on any plan.
#
# Nothing is rebuilt. The release image is retagged by digest, so the promoted
# tags resolve to byte-identical content -- the artifact CI tested is the
# artifact clusters pull. deploy/k8s/deployment.yaml pins :latest, so this is the
# moment running deployments move.
name: Promote release image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released tag to promote, exactly as pushed (e.g. v0.1.0)'
        required: true
        type: string
      latest:
        description: 'Also move :latest (uncheck for a backport or a patch to an older minor)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
          MOVE_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail

          case "${VERSION}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must look like v1.2.3, got '${VERSION}'"; exit 1 ;;
          esac

          # v0.1.0 -> 0.1.0 -> 0.1. docker.yml publishes the immutable tag
          # without the leading v (docker/metadata-action semver pattern).
          semver="${VERSION#v}"
          minor="${semver%.*}"
          src="${IMAGE}:${semver}"

          # Fail loudly rather than promoting a tag that was never published --
          # the likely mistake is running this before the Docker workflow
          # finished, or typing a tag that does not exist.
          if ! digest="$(docker buildx imagetools inspect "${src}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "::error::${src} is not published. Check the Docker workflow finished for tag ${VERSION}."
            exit 1
          fi

          echo "promoting ${src}"
          echo "  digest ${digest}"

          tags=( --tag "${IMAGE}:${minor}" )
          if [ "${MOVE_LATEST}" = "true" ]; then
            tags+=( --tag "${IMAGE}:latest" )
            echo "  moving :latest and :${minor}"
          else
            echo "  moving :${minor} only, leaving :latest where it is"
          fi

          # Registry-side copy: no pull, no rebuild, and the provenance and SBOM
          # attestation manifests in the index travel with it.
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${digest}"

          echo "--- :${minor} ---"
          docker buildx imagetools inspect "${IMAGE}:${minor}" --format '{{.Manifest.Digest}}'
          if [ "${MOVE_LATEST}" = "true" ]; then
            echo "--- :latest ---"
            docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}'
          fi

          {
            echo "### Promoted \`${VERSION}\`"
            echo ""
            echo "| tag | digest |"
            echo "|---|---|"
            echo "| \`${minor}\` | \`${digest}\` |"
            [ "${MOVE_LATEST}" = "true" ] && echo "| \`latest\` | \`${digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
