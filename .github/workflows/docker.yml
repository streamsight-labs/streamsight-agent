# Publishes ghcr.io/<owner>/<repo>, i.e.
# ghcr.io/streamsight-labs/streamsight-agent. That path is the one the Helm
# chart (charts/streamsight-agent/values.yaml) and the plain manifests
# (deploy/k8s/deployment.yaml) pull from -- they must not drift apart again.
#
# Pull requests do not push; .github/workflows/ci.yml builds the image without
# pushing so a broken Dockerfile is caught before it reaches a tag.
#
# The split below is borrowed from datadog-agent's pipeline, which separates
# "deploy_containers" from "deploy_mutable_image_tags", and it exists for two
# reasons:
#
#   1. Build once, promote by digest. `promote` never rebuilds -- it retags the
#      exact manifest `build` produced. Rebuilding from source at tag time would
#      ship an artifact that is not the one CI tested, even at the same commit.
#   2. Immutable tags land immediately; MUTABLE tags do not. :latest and the
#      floating :MAJOR.MINOR are what running clusters follow
#      (deploy/k8s/deployment.yaml pins :latest), so this workflow never writes
#      them. Moving them is a separate, manually-triggered run: see
#      .github/workflows/promote.yml, which explains why the gate is a manual
#      dispatch rather than an `environment:` approval.
name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # The index digest of what was pushed, including the attestation
      # manifests. promote retags this exact object.
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The string stamped into main.version, matching what the Makefile's
      # `git describe --tags --always --dirty` produces locally: the tag
      # verbatim for a release, branch+sha for a main build. It ends up on
      # every exported batch as agent_version, so it has to be meaningful.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="${{ github.ref_name }}-$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building version ${version}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # IMMUTABLE tags only. latest=false and no {{major}}.{{minor}} here:
          # both of those move between releases, so they belong to promote.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          # BuildKit generates both natively. They turn the pushed tag into an
          # OCI index carrying attestation manifests, which GHCR serves fine --
          # but it is the reason promote must retag by digest rather than
          # rebuild, or the attestations would not follow the tag.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
