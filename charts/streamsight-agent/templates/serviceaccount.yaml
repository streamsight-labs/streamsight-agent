{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "streamsight-agent.serviceAccountName" . }}
  labels:
    {{- include "streamsight-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent talks to Kafka and (optionally) one HTTP endpoint. It never calls
# the Kubernetes API, so there is no Role or RoleBinding and no mounted token.
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
