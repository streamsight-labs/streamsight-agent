{{- /*
Credentials only. Everything non-secret lives in the ConfigMap.

The Secret is created unconditionally, even when it ends up empty, so the
Deployment's envFrom can reference it without a matching conditional -- a
dangling secretRef would leave the pod stuck in CreateContainerConfigError.
An empty Opaque Secret is valid and costs nothing.

Both credentials are optional: file and stdout export modes need no API key,
and SASL is off by default. When an existingSecret is configured the value is
not copied here; the Deployment references that Secret directly.
*/ -}}
{{- $data := dict -}}
{{- if and .Values.export.http.apiKey (not .Values.export.http.existingSecret) -}}
{{- $_ := set $data "API_KEY" (.Values.export.http.apiKey | toString) -}}
{{- end -}}
{{- if and .Values.kafka.sasl.enabled .Values.kafka.sasl.password (not .Values.kafka.sasl.existingSecret) -}}
{{- $_ := set $data "KAFKA_SASL_PASSWORD" (.Values.kafka.sasl.password | toString) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "streamsight-agent.fullname" . }}
  labels:
    {{- include "streamsight-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml $data | nindent 2 }}
