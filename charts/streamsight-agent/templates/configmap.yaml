{{- include "streamsight-agent.validate" . -}}
{{- $mode := .Values.export.mode | toString -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "streamsight-agent.fullname" . }}
  labels:
    {{- include "streamsight-agent.labels" . | nindent 4 }}
data:
  # -- Kafka --------------------------------------------------------------
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  KAFKA_TLS_ENABLED: {{ .Values.kafka.tls.enabled | quote }}
  {{- if .Values.kafka.sasl.enabled }}
  KAFKA_SASL_MECHANISM: {{ .Values.kafka.sasl.mechanism | quote }}
  KAFKA_SASL_USERNAME: {{ .Values.kafka.sasl.username | quote }}
  {{- end }}

  # -- Export -------------------------------------------------------------
  EXPORT_MODE: {{ $mode | quote }}
  {{- if eq $mode "http" }}
  EXPORT_ENDPOINT: {{ .Values.export.http.endpoint | quote }}
  EXPORT_QUEUE_SIZE: {{ .Values.export.http.queueSize | int | quote }}
  EXPORT_MAX_RETRIES: {{ .Values.export.http.maxRetries | int | quote }}
  EXPORT_BASE_DELAY: {{ .Values.export.http.baseDelay | quote }}
  EXPORT_TIMEOUT: {{ .Values.export.http.timeout | quote }}
  EXPORT_GZIP: {{ .Values.export.http.gzip | quote }}
  {{- end }}
  {{- if eq $mode "file" }}
  EXPORT_FILE: {{ .Values.export.file.path | quote }}
  EXPORT_FILE_MAX_MB: {{ .Values.export.file.maxMB | int | quote }}
  EXPORT_FILE_MAX_BACKUPS: {{ .Values.export.file.maxBackups | int | quote }}
  EXPORT_FILE_FSYNC: {{ .Values.export.file.fsync | quote }}
  {{- end }}

  # -- Collection ---------------------------------------------------------
  COLLECTION_INTERVAL: {{ .Values.collection.interval | quote }}
  {{- with .Values.collection.timeout }}
  COLLECTION_TIMEOUT: {{ . | quote }}
  {{- end }}
  INCLUDE_INTERNAL_TOPICS: {{ .Values.collection.includeInternalTopics | quote }}
  {{- with .Values.collection.topicIncludeRegex }}
  TOPIC_INCLUDE_REGEX: {{ . | quote }}
  {{- end }}
  {{- with .Values.collection.topicExcludeRegex }}
  TOPIC_EXCLUDE_REGEX: {{ . | quote }}
  {{- end }}
  {{- with .Values.collection.groupIncludeRegex }}
  GROUP_INCLUDE_REGEX: {{ . | quote }}
  {{- end }}
  {{- with .Values.collection.groupExcludeRegex }}
  GROUP_EXCLUDE_REGEX: {{ . | quote }}
  {{- end }}
  {{- with .Values.collection.groupStates }}
  GROUP_STATES: {{ . | quote }}
  {{- end }}

  # -- Optional collectors ------------------------------------------------
  # Neither adds an ACL beyond the DESCRIBE on CLUSTER/TOPIC/GROUP the agent
  # already requires. They are payload and latency switches.
  COLLECT_LAST_STABLE_OFFSET: {{ .Values.collection.collectLastStableOffset | quote }}
  COLLECT_LOG_DIRS: {{ .Values.collection.collectLogDirs | quote }}
  {{- if .Values.collection.collectLogDirs }}
  LOG_DIRS_EVERY: {{ .Values.collection.logDirsEvery | int | quote }}
  {{- end }}

  # -- Cardinality caps ---------------------------------------------------
  # Only the caps that are set are rendered: the agent's own default for an
  # unset entity cap is "unlimited", and emitting five "0"s would read as a
  # deliberate choice rather than an absent one.
  MAX_ERRORS: {{ .Values.limits.maxErrors | int | quote }}
  MAX_ERROR_SAMPLES: {{ .Values.limits.maxErrorSamples | int | quote }}
  {{- if .Values.limits.maxTopics }}
  MAX_TOPICS: {{ .Values.limits.maxTopics | int | quote }}
  {{- end }}
  {{- if .Values.limits.maxPartitionsPerTopic }}
  MAX_PARTITIONS_PER_TOPIC: {{ .Values.limits.maxPartitionsPerTopic | int | quote }}
  {{- end }}
  {{- if .Values.limits.maxGroups }}
  MAX_GROUPS: {{ .Values.limits.maxGroups | int | quote }}
  {{- end }}
  {{- if .Values.limits.maxMembersPerGroup }}
  MAX_MEMBERS_PER_GROUP: {{ .Values.limits.maxMembersPerGroup | int | quote }}
  {{- end }}
  {{- if .Values.limits.maxOffsetsPerGroup }}
  MAX_OFFSETS_PER_GROUP: {{ .Values.limits.maxOffsetsPerGroup | int | quote }}
  {{- end }}

  # -- Agent --------------------------------------------------------------
  LOG_LEVEL: {{ .Values.agent.logLevel | quote }}
