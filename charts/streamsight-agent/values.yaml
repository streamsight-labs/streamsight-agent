# Default values for streamsight-agent.
#
# Every key below maps onto an environment variable read by
# internal/config/config.go. The agent validates the whole surface at startup
# and reports every problem at once, so a bad value fails the pod immediately
# rather than on the first collection tick.

# The agent is a singleton collector: two replicas means every batch is
# collected and shipped twice. Scale by sharding on topic/group filters across
# separate releases, not by raising this.
replicaCount: 1

image:
  # Published by .github/workflows/docker.yml as ghcr.io/<owner>/<repo>.
  repository: ghcr.io/streamsight-labs/streamsight-agent
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # Used when create is false, or as the name of the created account.
  name: ""

# The agent never calls the Kubernetes API, so it does not need a token.
automountServiceAccountToken: false

kafka:
  # KAFKA_BROKERS -- required, comma separated host:port.
  brokers: "broker:9092"

  sasl:
    # When enabled, mechanism/username/password are all required by the agent.
    enabled: false
    # KAFKA_SASL_MECHANISM -- PLAIN, SCRAM-SHA-256 or SCRAM-SHA-512.
    mechanism: "SCRAM-SHA-512"
    # KAFKA_SASL_USERNAME
    username: ""
    # KAFKA_SASL_PASSWORD, stored in the chart-managed Secret. Prefer
    # existingSecret in production so the credential is not in values.yaml.
    password: ""
    # Read KAFKA_SASL_PASSWORD from a Secret this chart does not manage.
    # Takes precedence over .password.
    existingSecret: ""
    existingSecretKey: "KAFKA_SASL_PASSWORD"

  tls:
    # KAFKA_TLS_ENABLED -- system root CAs, verified certificates, TLS 1.2 floor.
    enabled: false

export:
  # EXPORT_MODE -- file | http | stdout.
  #
  #   file   write JSONL to a volume (the default; no network, no credential)
  #   http   POST batches to a collector endpoint (needs endpoint + API key)
  #   stdout write JSONL to stdout for a log shipper to pick up
  mode: "file"

  http:
    # EXPORT_ENDPOINT -- required when mode is http.
    endpoint: ""
    # API_KEY -- required when mode is http, ignored otherwise. Stored in the
    # chart-managed Secret. Leave empty for file/stdout mode; the chart renders
    # valid manifests either way.
    apiKey: ""
    # Read API_KEY from a Secret this chart does not manage. Takes precedence
    # over .apiKey.
    existingSecret: ""
    existingSecretKey: "API_KEY"
    # EXPORT_QUEUE_SIZE -- bounded in-memory queue of ENCODED bodies. The
    # enqueue never blocks; an overflow evicts the OLDEST queued batch, so what
    # survives a slow ingest is the most recent picture of the cluster. 20 is
    # 100 seconds at the 5s interval, which covers the worst-case retry chain
    # for one batch -- it is a stall absorber, not an outage archive.
    queueSize: 20
    # EXPORT_MAX_RETRIES -- retries per batch on 408/429/5xx.
    maxRetries: 3
    # EXPORT_BASE_DELAY -- full-jitter backoff base.
    baseDelay: "1s"
    # EXPORT_TIMEOUT -- per-request deadline.
    timeout: "10s"
    # EXPORT_GZIP
    gzip: true

  file:
    # Writable mount point for file mode. The container root filesystem is
    # read-only, so this emptyDir is the only place the agent can write.
    mountPath: "/var/lib/streamsight"
    # EXPORT_FILE -- must live under mountPath or the chart refuses to render.
    path: "/var/lib/streamsight/metrics.jsonl"
    # EXPORT_FILE_MAX_MB -- rotate at this size. 0 uses the exporter's 100MB
    # default; a negative value disables rotation entirely (unbounded growth).
    maxMB: 100
    # EXPORT_FILE_MAX_BACKUPS -- rotated files kept. 0 keeps none.
    maxBackups: 3
    # EXPORT_FILE_FSYNC -- fsync after every batch. Off by default: a flush
    # already survives the process dying, and only power loss or a node crash
    # needs a device round trip. Collection is synchronous, so on a networked
    # volume a stalled fsync stalls collection itself. On the default emptyDir
    # (node disk, gone with the pod anyway) it buys nothing.
    fsync: false
    # emptyDir sizeLimit. Keep it above maxMB * (maxBackups + 1) or the kubelet
    # can evict the pod mid-rotation.
    sizeLimit: "1Gi"
    # emptyDir medium: "" for node disk, "Memory" for tmpfs (counts against
    # the container memory limit).
    medium: ""

collection:
  # Cadence knobs are EMPTY BY DEFAULT and rendered only when you set them, so
  # the agent's own defaults stay the single source of truth. The alternative --
  # restating each default here -- is how this file came to pin a 30s interval
  # for a build whose default had moved to 5s.
  #
  # COLLECTION_INTERVAL -- must be > 0. Empty uses the agent default, currently
  # 5s. Every *Every knob below is a CYCLE COUNT, so changing this changes their
  # wall-clock meaning too.
  interval: ""
  # COLLECTION_TIMEOUT -- per-cycle deadline. Empty lets the agent derive 80%
  # of the interval.
  timeout: ""
  # INCLUDE_INTERNAL_TOPICS -- __consumer_offsets and friends.
  includeInternalTopics: false
  # Filters. Empty means match everything. Exclude wins over include.
  # Compiled at startup, so a bad pattern fails the pod immediately.
  topicIncludeRegex: ""
  topicExcludeRegex: ""
  groupIncludeRegex: ""
  groupExcludeRegex: ""
  # GROUP_STATES -- comma separated, e.g. "Stable,Empty". Empty means every
  # state. Valid: Unknown, PreparingRebalance, CompletingRebalance, Stable,
  # Dead, Empty (case-insensitive; an unrecognised state fails the pod).
  #
  # This is the only cardinality control the broker applies before building the
  # response, so filtered groups never cross the wire -- but it needs
  # Kafka 2.6+ (ListGroups v4). The agent probes every broker at startup and
  # REFUSES TO START if any is older, because an older broker drops the filter
  # silently and returns every group. Two more things it changes: it shortens
  # offsets[] as well as groups[], and a group that leaves the filtered set is
  # indistinguishable at the backend from a deleted one.
  groupStates: ""

  # COLLECT_LAST_STABLE_OFFSET -- adds partitions[].last_stable_offset.
  # Leave it on. end_offset is the high watermark, so without the LSO every
  # read_committed consumer on a transactional topic reports permanent false
  # lag, silently. Costs one extra ListOffsets fan-out per cycle and no ACL.
  collectLastStableOffset: true
  # COLLECT_LOG_DIRS -- adds the log_dirs[] section: per-broker, per-directory
  # replica bytes, per-replica lag and offline-disk detection. On by default:
  # it is the only source of disk bytes, and days-to-full, per-topic storage
  # and byte-rate-per-record all rest on it. No ACL beyond the DESCRIBE on
  # CLUSTER already required.
  #
  # The response is O(replicas) = partitions x replication factor and is the
  # largest section the agent emits, which is what logDirsEvery is for. On a
  # wide cluster set limits.maxPartitionsPerTopic -- unlike the offset
  # listings, the log-dir request names partitions explicitly, so that cap
  # shrinks the request and not just the payload.
  collectLogDirs: true
  # LOG_DIRS_EVERY -- run the log-dirs phase every Nth cycle. Must be >= 1
  # (1 = every cycle). Empty uses the agent default, currently 24 = every two
  # minutes at the 5s interval. Rendered only when collectLogDirs is true.
  logDirsEvery: ""

  # MAX_TIMESTAMP_EVERY -- run the max-timestamp phase every Nth cycle. Must be
  # >= 1. Empty uses the agent default, currently 12 = once a minute at the 5s
  # interval. Cadenced because it is the only ListOffsets sentinel that is NOT
  # O(1) on the broker (-3 walks every local log segment, unlike -1/-2 which
  # read a number already in memory) and because partitions[].max_timestamp is
  # ~19% of the gzipped batch. It answers "when was the last record written",
  # which is a minutes-scale question. Set to 1 only if you genuinely need
  # 5-second liveness resolution and have measured the broker cost.
  maxTimestampEvery: ""

  # COLLECT_CONFIGS -- adds topic_configs[] and broker_configs[]. On by
  # default, and the only collector needing an ACL outside the three DESCRIBE
  # grants: DESCRIBE_CONFIGS on TOPIC and on CLUSTER. Missing either is not
  # fatal -- that section reports `unauthorized` and the rest of the batch is
  # unaffected. Leave it on: without cleanup.policy nothing downstream can tell
  # a topic is compacted, and on a compacted topic consumer lag is overstated
  # by an unknowable amount with nothing flagging it as unreliable.
  collectConfigs: true
  # CONFIGS_EVERY -- run the configs phase every Nth cycle. Empty uses the
  # agent default, currently 360 = every thirty minutes at the 5s interval,
  # the slowest cadence in the agent. Rendered only when collectConfigs is
  # true.
  configsEvery: ""

  # COLLECT_CONSUMER_GROUPS -- describes new-protocol (KIP-848) groups via
  # ConsumerGroupDescribe, alongside the classic DescribeGroups that stays
  # authoritative. On by default and free on an older cluster: the startup
  # probe disables it below Kafka 4.0 rather than erroring every cycle.
  collectConsumerGroups: true

  # COLLECT_MAX_TIMESTAMP -- adds partitions[].max_timestamp, the broker's own
  # answer to "when was the last record written". On by default; see
  # maxTimestampEvery above for why it is cadenced rather than per-cycle.
  collectMaxTimestamp: true

  # COLLECT_THROUGHPUT_WINDOW -- adds partitions[].window, an offset plus the
  # broker's timestamp for it, so a backend gets a server-measured record count
  # over a known span instead of differencing two batches. OFF by default: it
  # is an extra ListOffsets fan-out per cycle, and a backend that keeps history
  # can already difference consecutive batches.
  collectThroughputWindow: false
  # THROUGHPUT_WINDOW -- how far back the window reaches. Empty uses the agent
  # default, currently 5m. Rendered only when collectThroughputWindow is true.
  # A window narrower than the collection interval buys nothing and warns.
  throughputWindow: ""
  # THROUGHPUT_WINDOW_EVERY -- run it every Nth cycle. Must be >= 1. Empty uses
  # the agent default, currently 1 (every cycle).
  throughputWindowEvery: ""

  # COLLECT_TIERED_OFFSETS -- adds tiered.local_start_offset (KIP-405): the
  # earliest offset actually on broker disk, as opposed to start_offset which
  # on a tiered cluster includes remote storage. OFF by default because on a
  # cluster without remote storage it costs a round trip to return the same
  # answer as start_offset. Needs Kafka 3.4+.
  collectTieredOffsets: false
  # COLLECT_LATEST_TIERED -- additionally asks for tiered.remote_end_offset
  # (KIP-1005). SUBORDINATE: ignored unless collectTieredOffsets is also true.
  # Gated separately because KIP-1005 landed five releases after KIP-405, so a
  # 3.4-3.8 cluster serves one and not the other. Needs Kafka 3.9+.
  collectLatestTiered: true

  # COLLECT_SHARE_GROUPS -- adds the share_groups[] section (KIP-932). Share
  # groups are not consumer groups under another name: members share partitions
  # and acknowledge individual records, so there is no committed offset per
  # partition and no lag in the committed-versus-end sense. OFF by default and
  # needs Kafka 4.0+.
  collectShareGroups: false

  # COLLECT_REASSIGNMENTS -- adds reassignments[]. On by default and nearly
  # free: the ListPartitionReassignments request is issued only on a cycle that
  # already observed an under-replicated partition, so a healthy cluster pays
  # nothing. Lets URP alerting subtract partitions that are moving on purpose.
  collectReassignments: true

  # COLLECT_EPOCH_PROBES -- adds epoch_probes[]. On by default for the same
  # reason: OffsetForLeaderEpoch is issued only when a committed leader epoch
  # disagrees with the partition's current one, and each distinct question is
  # asked once per process lifetime.
  collectEpochProbes: true

  # COLLECT_RPC_STATS -- adds the agent.rpc section: per-broker, per-API-key
  # request counts, bytes and latency histograms, as raw counters over a window
  # rather than rates or percentiles. On by default because it issues NO extra
  # requests -- the counters come from kgo hooks on traffic already happening.
  #
  # It is, however, the switch that costs PAYLOAD: the section grows with
  # brokers x API keys and has no cap of its own. Measured at 4% of the batch on
  # a 3-broker cluster; on a large fleet, check batch bytes before leaving it on.
  collectRpcStats: true

# Cardinality caps: hard ceilings on what one batch may contain.
#
# Every ENTITY cap defaults to 0 = unlimited, and that is deliberate -- a
# non-zero default would silently shorten the customer's own inventory on first
# deploy. Use collection.topicIncludeRegex / groupIncludeRegex for intentional
# selection; use these when you have measured the cluster and need a ceiling.
# Setting any of them logs a startup warning. None of them adds a request or an
# ACL. A cap left at 0 is not rendered into the ConfigMap at all.
limits:
  # MAX_ERRORS -- bounds errors[] per batch. 0 = unlimited (and warns).
  # Errors are deduplicated unconditionally, so this backstop essentially
  # never fires; when it does, whole-request and authorization failures are
  # admitted ahead of the per-partition flood.
  maxErrors: 1000
  # MAX_ERROR_SAMPLES -- verbatim occurrences per distinct failure mode before
  # the rest are folded into the exemplar's count. Must be >= 1.
  maxErrorSamples: 1
  # MAX_TOPICS -- also shrinks the request fan-out (the topic list sent to the
  # offset listings and to DescribeLogDirs).
  maxTopics: 0
  # MAX_PARTITIONS_PER_TOPIC -- payload cap for the offset listings (the broker
  # computes every partition regardless), but it does shrink the log-dirs
  # request, whose partitions are named on the wire.
  maxPartitionsPerTopic: 0
  # MAX_GROUPS -- enforced once on the shared ListGroups result, so it shrinks
  # the DescribeGroups and OffsetFetch fan-out AND truncates the offsets
  # section, not just groups.
  maxGroups: 0
  # MAX_MEMBERS_PER_GROUP
  maxMembersPerGroup: 0
  # MAX_OFFSETS_PER_GROUP
  maxOffsetsPerGroup: 0

agent:
  # LOG_LEVEL -- debug | info | warn | error. Logs go to stderr, so stdout
  # stays parseable JSONL in stdout export mode.
  logLevel: "info"
  # AGENT_INSTANCE_ID. Empty uses the pod name, which is stable across
  # container restarts; the agent's own default appends a per-boot random
  # suffix, which would make the backend see a new instance after every crash.
  instanceId: ""

# Anything not modelled above. Appended verbatim to the container env, so it
# also wins over the generated values.
extraEnv: []
#  - name: SOME_FUTURE_KNOB
#    value: "1"

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

# Recreate, not RollingUpdate: a surge pod would collect and export the same
# cluster twice for the length of the rollout.
strategy:
  type: Recreate

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  # Gives uid 1000 write access to the emptyDir volumes.
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# The agent exposes no HTTP server, so there is nothing to probe. It exits
# non-zero on an unrecoverable error and the kubelet restarts it.

podAnnotations: {}
podLabels: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
