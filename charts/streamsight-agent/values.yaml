replicaCount: 1

image:
  repository: ghcr.io/streamsight/agent
  pullPolicy: IfNotPresent
  tag: ""

# Required
kafka:
  brokers: "broker:9092"
  # SASL authentication (optional)
  sasl:
    enabled: false
    mechanism: "SCRAM-SHA-512"
    username: ""
    password: ""
  tls:
    enabled: false

apiKey: ""

# Optional
collectionInterval: "30s"
logLevel: "info"

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

nodeSelector: {}
tolerations: []
affinity: {}
